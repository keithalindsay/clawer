name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy source via rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --delete \
            --exclude '.env.local' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.next' \
            . root@${{ secrets.DEPLOY_HOST }}:/opt/clawer/

      - name: Build & restart on server
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} << 'SCRIPT'
            cd /opt/clawer
            export NODE_ENV=production
            npm install --production=false
            npx next build
            pm2 restart clawer
          SCRIPT

      - name: Health check
        run: |
          sleep 5
          for i in {1..3}; do
            echo "Health check attempt $i/3..."
            STATUS=$(ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deploy successful! Server returned 200"
              exit 0
            fi
            echo "Got status $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed"
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            "pm2 logs clawer --lines 20 --nostream"
          exit 1
