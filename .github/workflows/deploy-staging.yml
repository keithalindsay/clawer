name: Deploy to Staging

on:
  push:
    branches: [staging]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy source via rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --delete \
            --exclude '.env.local' \
            --exclude '.env' \
            --exclude '.env.staging' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.next' \
            . root@${{ secrets.DEPLOY_HOST }}:/opt/clawer-staging/

      - name: Build & restart on server
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} << 'SCRIPT'
            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            
            cd /opt/clawer-staging
            set -a && source .env && set +a
            
            pnpm install --frozen-lockfile 2>/dev/null || pnpm install
            pnpm build
            
            # Run DB migrations
            npx drizzle-kit push --force 2>/dev/null || true
            
            # Restart or start PM2 process
            if pm2 describe clawer-staging > /dev/null 2>&1; then
              pm2 restart clawer-staging
            else
              pm2 start "npx next start -p 3001" --name clawer-staging --cwd /opt/clawer-staging
              pm2 save
            fi
          SCRIPT

      - name: Health check
        run: |
          sleep 5
          for i in {1..3}; do
            echo "Health check attempt $i/3..."
            STATUS=$(ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging deploy successful! Server returned 200"
              exit 0
            fi
            echo "Got status $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "❌ Staging health check failed"
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            "pm2 logs clawer-staging --lines 20 --nostream"
          exit 1
